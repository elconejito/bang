<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eceef0; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #1a1c1f; -webkit-font-smoothing: antialiased; }
  ::selection { background: #ecd9a0; }
  svg.lu { display: block; flex: none; }
</style>
</helmet>

<div style="min-height:100vh;position:relative">

  <!-- ===================== APP BAR ===================== -->
  <div style="display:flex;align-items:center;gap:28px;background:#1a1c1f;color:#cfd3d7;padding:0 32px;height:56px;border-bottom:1px solid #000">
    <div style="display:flex;align-items:center;gap:9px">
      <div style="width:22px;height:22px;border:2px solid #fff;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center"><div style="width:6px;height:6px;background:#c2a14d;border-radius:50%"></div></div>
      <span style="font-family:'Schibsted Grotesk',sans-serif;font-weight:800;font-size:19px;color:#fff;letter-spacing:-0.02em">Bang</span>
    </div>
    <div style="display:flex;gap:24px;font-size:15px;font-weight:500;height:100%;align-items:center">
      <span style="color:#cfd3d7">Firearms</span>
      <span style="color:#fff;border-bottom:2px solid #c2a14d;height:100%;display:flex;align-items:center">Ammo</span>
      <span style="color:#cfd3d7">Accessories</span>
      <span style="color:#cfd3d7">Training</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px">
      <div style="width:26px;height:26px;border-radius:50%;background:#3a3e44;color:#cfd3d7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace">H</div>
      <span>Harvey</span>
    </div>
  </div>

  <!-- ===================== GHOST PAGE BEHIND ===================== -->
  <div style="max-width:1280px;margin:0 auto;padding:24px 32px;filter:blur(1.5px);opacity:0.55;pointer-events:none;user-select:none">
    <div style="height:13px;width:280px;background:#d6d9dc;border-radius:3px;margin-bottom:18px"></div>
    <div style="height:26px;width:360px;background:#cdd1d4;border-radius:3px;margin-bottom:24px"></div>
    <div style="display:grid;grid-template-columns:344px 1fr;gap:24px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="height:130px;background:#fff;border:1px solid #e2e4e6;border-radius:3px"></div>
        <div style="height:150px;background:#fff;border:1px solid #e2e4e6;border-radius:3px"></div>
        <div style="height:180px;background:#fff;border:1px solid #e2e4e6;border-radius:3px"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div style="height:150px;background:#fff;border:1px solid #e2e4e6;border-radius:3px"></div><div style="height:150px;background:#fff;border:1px solid #e2e4e6;border-radius:3px"></div></div>
        <div style="height:320px;background:#fff;border:1px solid #e2e4e6;border-radius:3px"></div>
      </div>
    </div>
  </div>

  <!-- ===================== SCRIM + MODAL ===================== -->
  <div style="position:fixed;inset:56px 0 0 0;background:rgba(20,22,26,0.46);display:flex;align-items:flex-start;justify-content:center;padding:56px 24px 24px;z-index:40;overflow:auto">
    <div style="width:484px;max-width:100%;background:#fff;border:1px solid #d6d9dc;border-radius:4px;box-shadow:0 10px 30px rgba(20,22,26,0.22),0 2px 8px rgba(20,22,26,0.12);overflow:hidden">

      <!-- header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid #eef0f1">
        <div>
          <div style="font-family:'Schibsted Grotesk',sans-serif;font-weight:600;font-size:19px;line-height:1.1">Add stock</div>
          <div style="font-size:13px;color:#8a9098;margin-top:2px">American Eagle 115gr FMJ · 9mm</div>
        </div>
        <span style="cursor:pointer;color:#8a9098;padding:2px" style-hover="color:#1a1c1f"><svg class="lu" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
      </div>

      <div style="padding:18px;display:flex;flex-direction:column;gap:16px">

        <!-- mode toggle -->
        <div style="display:flex;border:1px solid #c2c6ca;border-radius:3px;overflow:hidden;width:fit-content">
          <span style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#1a1c1f;color:#fff;font-size:14px;font-weight:500"><svg class="lu" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Purchase</span>
          <span style="padding:7px 14px;background:#fff;color:#5b6066;font-size:14px;font-weight:500;border-left:1px solid #c2c6ca;cursor:pointer" style-hover="background:#f5f6f7">Adjustment ±</span>
        </div>

        <!-- quick: rounds + date -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:14px;font-weight:500">Rounds added</label>
            <div style="border:1.5px solid #c2a14d;border-radius:3px;padding:9px 12px;font-size:18px;font-family:'JetBrains Mono',monospace;background:#fff;box-shadow:0 0 0 3px #f4ecd6;display:flex;align-items:center">500<span style="width:1px;height:20px;background:#1a1c1f;margin-left:1px"></span></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:14px;font-weight:500">Date</label>
            <div style="border:1px solid #c2c6ca;border-radius:3px;padding:9px 12px;font-size:15px;background:#fff;display:flex;align-items:center;justify-content:space-between"><span style="font-family:'JetBrains Mono',monospace;font-size:14px;white-space:nowrap">May 20, 2026</span><svg class="lu" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a9098" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></div>
          </div>
        </div>

        <!-- expander: purchase details -->
        <div style="border-top:1px solid #eef0f1;padding-top:15px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;cursor:pointer">
            <span style="font-size:15px;font-weight:600;color:#1a1c1f;white-space:nowrap">Purchase details</span>
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#8a9098">optional <svg class="lu" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d6320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></span>
          </div>

          <div style="display:flex;flex-direction:column;gap:14px">
            <!-- cost -->
            <div style="display:flex;flex-direction:column;gap:6px">
              <label style="font-size:14px;font-weight:500">Cost</label>
              <div style="display:flex;gap:10px;align-items:center">
                <div style="flex:1;border:1px solid #c2c6ca;border-radius:3px;padding:9px 12px;font-size:15px;background:#fff;display:flex;align-items:center;gap:6px"><span style="color:#8a9098;font-family:'JetBrains Mono',monospace">$</span><span style="font-family:'JetBrains Mono',monospace">150.00</span></div>
                <div style="display:flex;border:1px solid #c2c6ca;border-radius:3px;overflow:hidden;font-size:13px;flex:none">
                  <span style="padding:8px 11px;background:#1a1c1f;color:#fff;white-space:nowrap">$ total</span>
                  <span style="padding:8px 11px;background:#fff;color:#5b6066;border-left:1px solid #c2c6ca;cursor:pointer;white-space:nowrap" style-hover="background:#f5f6f7">$ / rd</span>
                </div>
              </div>
              <span style="font-size:13px;color:#8a9098">= <span style="font-family:'JetBrains Mono',monospace;color:#5b6066">$0.30</span> / round</span>
            </div>
            <!-- store / order -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
              <div style="display:flex;flex-direction:column;gap:6px">
                <label style="font-size:14px;font-weight:500">Store / FFL</label>
                <div style="border:1px solid #c2c6ca;border-radius:3px;padding:9px 12px;font-size:15px;background:#fff;display:flex;align-items:center;justify-content:space-between"><span>Cabela's</span><svg class="lu" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a9098" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <label style="font-size:14px;font-weight:500">Order # / ref</label>
                <div style="border:1px solid #c2c6ca;border-radius:3px;padding:9px 12px;font-size:15px;background:#fff;color:#8a9098">optional</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- footer -->
      <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid #eef0f1;background:#fafbfb">
        <span style="display:inline-flex;align-items:center;gap:7px;font-family:'Hanken Grotesk';font-weight:600;font-size:15px;background:#c2a14d;color:#1a1c1f;padding:9px 18px;border:1px solid #b08a2e;border-radius:3px;cursor:pointer;white-space:nowrap" style-hover="background:#b8902f"><svg class="lu" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add 500 rounds</span>
        <span style="font-family:'Hanken Grotesk';font-weight:600;font-size:15px;background:#fff;color:#3a3e44;padding:9px 18px;border:1px solid #c2c6ca;border-radius:3px;cursor:pointer" style-hover="background:#f5f6f7">Cancel</span>
        <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a9098;white-space:nowrap">850 → 1,350</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
